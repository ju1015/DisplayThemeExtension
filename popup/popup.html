<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeaAndCode Theme</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    <!-- Header Section -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <img src="../icons/icon48.png" alt="TeaAndCode Logo" width="28" height="28">
        </div>
        <div class="brand-text">
          <span class="brand-name">TeaAndCode</span>
          <span class="brand-subtitle">Reader Mode</span>
        </div>
      </div>
      <div class="badge" id="domainBadge" title="Current Website">
        <span class="status-dot"></span>
        <span class="domain-text" id="domainName">active tab</span>
      </div>
    </header>

    <!-- Master Switch Card -->
    <div class="power-card">
      <div class="power-info">
        <span class="power-title">Theme Engine</span>
        <span class="power-status" id="powerStatus">Disabled</span>
      </div>
      <label class="switch" for="toggleTheme">
        <input type="checkbox" id="toggleTheme">
        <span class="slider round"></span>
      </label>
    </div>

    <!-- Theme Preset Section -->
    <div class="section" id="themePresetsSection">
      <div class="section-header">
        <span class="section-title">Flavor / Presets</span>
        <span class="section-hint">Select tone</span>
      </div>
      <div class="theme-grid">
        <button class="theme-btn active" data-theme="midnight" title="Pure OLED Dark">
          <span class="swatch swatch-midnight"></span>
          <span class="theme-label">Midnight</span>
        </button>
        <button class="theme-btn" data-theme="sepia" title="Cozy Warm Tea / Sepia">
          <span class="swatch swatch-sepia"></span>
          <span class="theme-label">Warm Chai</span>
        </button>
        <button class="theme-btn" data-theme="slate" title="Nordic Cool Slate">
          <span class="swatch swatch-slate"></span>
          <span class="theme-label">Nordic</span>
        </button>
        <button class="theme-btn" data-theme="matcha" title="Gentle Forest Green">
          <span class="swatch swatch-matcha"></span>
          <span class="theme-label">Matcha</span>
        </button>
      </div>
    </div>

    <!-- Sliders Section -->
    <div class="section controls-section" id="controlsSection">
      <div class="section-header">
        <span class="section-title">Fine-Tuning</span>
        <button class="btn-reset" id="btnReset" title="Reset fine-tuning to defaults">Reset</button>
      </div>

      <!-- Brightness Slider -->
      <div class="control-row">
        <div class="control-label">
          <span class="control-icon">☀️</span>
          <span>Brightness</span>
          <span class="control-val" id="brightnessVal">90%</span>
        </div>
        <input type="range" id="sliderBrightness" min="60" max="110" value="90" class="custom-range">
      </div>

      <!-- Contrast Slider -->
      <div class="control-row">
        <div class="control-label">
          <span class="control-icon">🌓</span>
          <span>Contrast</span>
          <span class="control-val" id="contrastVal">100%</span>
        </div>
        <input type="range" id="sliderContrast" min="70" max="130" value="100" class="custom-range">
      </div>
    </div>

    <!-- Footer Section -->
    <footer class="footer">
      <span class="shortcut-hint"><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd> to toggle</span>
      <span class="footer-tag">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
